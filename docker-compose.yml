services:
  dockerview:
    build: .
    image: dockerview:latest
    container_name: dockerview
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/compose:/app/data/compose
    environment:
      DOCKERVIEW_ADDR: ":8080"
      DOCKERVIEW_COMPOSE_DIR: /app/data/compose
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
